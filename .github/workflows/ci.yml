
name: LankaTransit CI

on:
  push:
    branches:
      - main
      - devops/testing

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: Backend
        run: npm ci

      - name: Run tests
        working-directory: Backend
        run: npm test

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ghcr.io/yasirurashmika/lankatransit-backend:latest
            ghcr.io/yasirurashmika/lankatransit-backend:${{ github.sha }}

      - name: Publish Frontend Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: |
            ghcr.io/yasirurashmika/lankatransit-frontend:latest
            ghcr.io/yasirurashmika/lankatransit-frontend:${{ github.sha }}
